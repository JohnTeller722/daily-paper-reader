  - tag: agent-memory
    description: 请帮我检索和跟踪“智能体记忆（Agent Memory / Memory for LLM Agents）”方向的代表性论文和最新 arXiv 论文，研究对象限定为大语言模型驱动的智能体，而不是一般神经网络记忆或传统 RAG 系统。重点关注：1）记忆类型：working memory、episodic memory、semantic memory、procedural memory、long-term memory；2）记忆机制：memory retrieval、memory writing、memory update、memory consolidation、reflection、forgetting、memory compression；3）系统架构：memory-augmented agents、cognitive architecture、Memory OS、personalized agents、multi-agent shared memory；4）评测与安全：long-context memory benchmarks、memory poisoning、privacy、selective forgetting。请同时检索 2023 年以来的最新工作和更早的基础性论文，并按照“发展阶段—代表论文—核心方法—不足—前沿趋势”的方式整理。
